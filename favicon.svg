<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#030712" stroke="url(#bgGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Subtle Inner Gradient Fill -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#bgGrad)" fill-opacity="0.15"/>

  <!-- Code Bracket Left < -->
  <path d="M35 34 L21 50 L35 66" fill="none" stroke="url(#codeGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Slash / -->
  <path d="M57 30 L43 70" fill="none" stroke="#818cf8" stroke-width="6.5" stroke-linecap="round" />

  <!-- Code Bracket Right > -->
  <path d="M65 34 L79 50 L65 66" fill="none" stroke="url(#codeGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
